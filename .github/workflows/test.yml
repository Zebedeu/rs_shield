name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    env:
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
    steps:
      - uses: actions/checkout@v6
      
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev pkg-config \
            libglib2.0-dev libglib2.0-0 \
            libgtk-3-dev libgdk-pixbuf-2.0-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev
      
      - name: Run tests
        run: cargo test --workspace --verbose
        continue-on-error: ${{ matrix.rust == 'beta' }}

  s3-minio:
    name: S3 integration (MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned release; GitHub service containers cannot pass `server /data`,
      # so the container is started with `docker run` below.
      MINIO_IMAGE: minio/minio:RELEASE.2025-03-12T18-04-18Z
      MINIO_ROOT_USER: rsbtest
      MINIO_ROOT_PASSWORD: rsbtest-secret-key
      RSB_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      RSB_TEST_S3_BUCKET: rsb-test
      RSB_TEST_S3_ACCESS_KEY: rsbtest
      RSB_TEST_S3_SECRET_KEY: rsbtest-secret-key
      # Fail instead of skipping if the variables above are lost.
      RSB_TEST_S3_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
            "$MINIO_IMAGE" server /data
          for _ in $(seq 1 60); do
            if curl -sf "$RSB_TEST_S3_ENDPOINT/minio/health/live"; then
              echo "MinIO is up"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready" >&2
          docker logs minio
          exit 1

      - name: Create test bucket
        run: |
          docker exec \
            -e MC_HOST_local="http://$MINIO_ROOT_USER:$MINIO_ROOT_PASSWORD@127.0.0.1:9000" \
            minio mc mb "local/$RSB_TEST_S3_BUCKET"

      - name: Build S3 tests
        run: cargo test -p rsb-sdk --test s3_compat_integration_tests --no-run

      - name: Run S3 tests
        run: cargo test -p rsb-sdk --test s3_compat_integration_tests -- --nocapture

      - name: MinIO logs
        if: failure()
        run: docker logs minio

  test-features:
    name: Test Features
    runs-on: ubuntu-latest
    env:
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
    steps:
      - uses: actions/checkout@v6
      
      - uses: dtolnay/rust-toolchain@stable
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev pkg-config \
            libglib2.0-dev libglib2.0-0 \
            libgtk-3-dev libgdk-pixbuf-2.0-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev
      
      - name: Test all features
        run: cargo test --all-features --workspace
      
      - name: Test no-default-features
        run: cargo test --no-default-features --workspace

  test-docs:
    name: Test Documentation
    runs-on: ubuntu-latest
    env:
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
    steps:
      - uses: actions/checkout@v6
      
      - uses: dtolnay/rust-toolchain@stable
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libglib2.0-dev libglib2.0-0
      
      - name: Test doc examples
        run: cargo test --doc

  miri:
    name: Miri (Memory Safety)
    runs-on: ubuntu-latest
    env:
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
    steps:
      - uses: actions/checkout@v6
      
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libglib2.0-dev libglib2.0-0
      
      - name: Run tests under Miri
        run: cargo +nightly miri test
        continue-on-error: true
