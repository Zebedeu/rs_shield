name: Benchmarks

# Pull requests: quick subset (RSB_BENCH_PROFILE=quick, in-memory storage,
# small fixtures; target < 5 min with a warm cache), compared with the
# latest quick baseline from main.
# main / weekly schedule / manual: the quick subset (refreshes the PR
# baseline) and the full set (all fixtures, local + in-memory + 20 ms
# latency storage, plus the perf_probe table with peak RSS and storage
# calls), each compared with its previous baseline.
#
# Regressions above 120% of the baseline only WARN for now
# (fail-on-alert: false). To make them fail, set fail-on-alert: true
# (see docs/PERFORMANCE.md).

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/rsb-sdk/**'
      - 'Cargo.toml'
      - '.github/workflows/benchmark.yml'
  push:
    branches: [ main ]
    paths:
      - 'crates/rsb-sdk/**'
      - 'Cargo.toml'
      - '.github/workflows/benchmark.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Bench builds without LTO: much faster to build; numbers are compared
  # with baselines built the same way.
  CARGO_PROFILE_BENCH_LTO: "false"
  CARGO_PROFILE_BENCH_CODEGEN_UNITS: "16"
  CARGO_PROFILE_BENCH_DEBUG: "0"
  # Criterion otherwise runs `cargo metadata` to find the target dir.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  bench:
    name: Benchmarks (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.profile == 'quick' && 20 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ github.event_name == 'pull_request' && fromJSON('["quick"]') || fromJSON('["quick","full"]') }}
    env:
      RSB_BENCH_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libdbus-1-dev

      - name: Build benchmarks
        run: cargo bench -p rsb-sdk --no-run

      - name: Run criterion benchmarks
        run: |
          cargo bench -p rsb-sdk --bench backup_restore -- --output-format bencher \
            | tee output.txt

      - name: Restore baseline
        uses: actions/cache/restore@v4
        with:
          path: bench-baseline
          key: bench-baseline-${{ matrix.profile }}-${{ github.run_id }}
          restore-keys: bench-baseline-${{ matrix.profile }}-

      - name: Compare with baseline (warn only)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: rsb-sdk ${{ matrix.profile }}
          tool: cargo
          output-file-path: output.txt
          external-data-json-path: bench-baseline/benchmark-data.json
          # Only main / schedule runs move the baseline.
          save-data-file: ${{ github.event_name != 'pull_request' }}
          alert-threshold: '120%'
          fail-on-alert: false
          summary-always: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save baseline
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: bench-baseline
          key: bench-baseline-${{ matrix.profile }}-${{ github.run_id }}

      - name: Peak RSS and storage calls (full only)
        if: matrix.profile == 'full'
        run: |
          cargo bench -p rsb-sdk --bench perf_probe -- \
            --only large --only small-lat --only large-lat --only incr-lat \
            | tee probe.md
          cat probe.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.profile }}-${{ github.sha }}
          path: |
            output.txt
            probe.md
            target/criterion
          if-no-files-found: ignore
